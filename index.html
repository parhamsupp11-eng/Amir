گردونه شانس body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; } .btn { background: #ffcc00; color: #000; padding: 12px 25px; border-radius: 12px; font-size: 18px; margin-top: 20px; border: none; } canvas { margin-top: 40px; } 

گردونه شانس

<button class="btn" onclick="spinWheel()">چرخاندن گردونه</button> <canvas id="wheel" width="350" height="350"></canvas> <script> const prizes = ["1$", "2$", "5$", "10$", "20$", "50$", "100$", "200$"]; const canvas = document.getElementById("wheel"); const ctx = canvas.getContext("2d"); const total = prizes.length; const arc = (2 * Math.PI) / total; function drawWheel() { for (let i = 0; i < total; i++) { let angle = i * arc; ctx.beginPath(); ctx.fillStyle = i % 2 === 0 ? "#ff4444" : "#4444ff"; ctx.moveTo(175, 175); ctx.arc(175, 175, 170, angle, angle + arc); ctx.fill(); ctx.save(); ctx.translate(175, 175); ctx.rotate(angle + arc / 2); ctx.textAlign = "right"; ctx.fillStyle = "#fff"; ctx.font = "20px sans-serif"; ctx.fillText(prizes[i], 150, 10); ctx.restore(); } } drawWheel(); let spinning = false; function spinWheel() { if (spinning) return; spinning = true; let randomSpin = Math.floor(Math.random() * 360) + 720; let angle = 0; const speed = 15; const spinInterval = setInterval(() => { angle += speed; canvas.style.transform = `rotate(${angle}deg)`; if (angle >= randomSpin) { clearInterval(spinInterval); spinning = false; let finalDeg = angle % 360; let index = total - Math.floor(finalDeg / (360 / total)) - 1; if (index < 0) index += total; const prize = prizes[index]; alert("جایزه شما: " + prize); } }, 20); } </script>
